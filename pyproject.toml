[project]
name = "time-series-retail-forecasting"
version = "0.1.0"
description = ""
authors = [
    {name = "SofiCholoian888",email = "SofiCholoian@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "statsforecast (>=2.1.1,<3.0.0)",
    "neuralforecast (>=3.2.2,<4.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.10.0,<27.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "nbqa (>=1.9.1,<2.0.0)",
    "nbstripout (>=0.9.1,<0.10.0)"
]

[tool.poetry]
packages = [{ include = "retail_forecasting", from = "src" }]
