[project]
name = "time-series-retail-forecasting"
version = "0.2.0"
description = "Reproducible retail sales forecasting with XGBoost and MLForecast"
authors = [{name = "SofiCholoian888"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
    "scikit-learn==1.6.1", "xgboost==3.0.2", "mlforecast==1.0.2",
    "coreforecast==0.0.16", "utilsforecast==0.2.12", "numba==0.61.2",
]

[project.scripts]
retail-forecast = "retail_forecasting.cli:main"

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "retail_forecasting", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
ruff = "0.11.13"
pre-commit = "4.2.0"
pre-commit-hooks = "5.0.0"
nbformat = "5.10.4"
nbstripout = "0.8.1"

[tool.poetry.group.research]
optional = true

[tool.poetry.group.research.dependencies]
statsforecast = "2.0.1"
neuralforecast = "3.0.2"
torch = "2.6.0"
lightgbm = "4.6.0"
statsmodels = "0.14.4"
pyarrow = "20.0.0"
matplotlib = "3.10.3"
seaborn = "0.13.2"
jupyterlab = "4.4.3"
ipykernel = "6.29.5"
tqdm = "4.67.1"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
